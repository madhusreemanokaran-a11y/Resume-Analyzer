server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- File upload limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- JWT ----
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-string-in-production-please}
jwt.expiration-ms=86400000

# ---- Anthropic (Claude) API ----
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=${ANTHROPIC_API_MODEL:claude-3-5-sonnet-20241022}
anthropic.api.url=https://api.anthropic.com/v1/messages
