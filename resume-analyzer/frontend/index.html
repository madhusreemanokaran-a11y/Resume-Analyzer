<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Analyzer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell" style="max-width: 480px;">

  <div style="text-align:center; margin-bottom: 40px;">
    <h1>Resume Analyzer</h1>
    <p class="muted">See exactly how your resume reads to an ATS — and to the role you're aiming for.</p>
  </div>

  <div class="card" id="login-card">
    <h2>Log in</h2>
    <label>Email</label>
    <input type="email" id="login-email">
    <label>Password</label>
    <input type="password" id="login-password">
    <button onclick="handleLogin()">Log in</button>
    <div class="error" id="login-error"></div>
    <p class="muted" style="margin-top:18px;">
      New here? <a href="#" onclick="toggleForms()">Create an account</a>
    </p>
  </div>

  <div class="card" id="register-card" style="display:none;">
    <h2>Create your account</h2>
    <label>Name</label>
    <input type="text" id="reg-name">
    <label>Email</label>
    <input type="email" id="reg-email">
    <label>Password</label>
    <input type="password" id="reg-password">
    <label>Target job role</label>
    <input type="text" id="reg-role" placeholder="e.g. Java Developer">
    <button onclick="handleRegister()">Create account</button>
    <div class="error" id="register-error"></div>
    <p class="muted" style="margin-top:18px;">
      Already have an account? <a href="#" onclick="toggleForms()">Log in</a>
    </p>
  </div>

</div>

<script src="js/api.js"></script>
<script>
  if (getToken()) window.location.href = "dashboard.html";

  function toggleForms() {
    const login = document.getElementById("login-card");
    const reg = document.getElementById("register-card");
    login.style.display = login.style.display === "none" ? "block" : "none";
    reg.style.display = reg.style.display === "none" ? "block" : "none";
  }

  async function handleLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errorEl = document.getElementById("login-error");
    errorEl.textContent = "";
    try {
      await loginUser(email, password);
      window.location.href = "dashboard.html";
    } catch (e) {
      errorEl.textContent = e.message;
    }
  }

  async function handleRegister() {
    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value;
    const role = document.getElementById("reg-role").value.trim();
    const errorEl = document.getElementById("register-error");
    errorEl.textContent = "";
    try {
      await registerUser(name, email, password, role);
      window.location.href = "dashboard.html";
    } catch (e) {
      errorEl.textContent = e.message;
    }
  }
</script>
</body>
</html>
