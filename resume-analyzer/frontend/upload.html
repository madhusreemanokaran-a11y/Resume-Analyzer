<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyze Resume</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <div class="masthead">
    <div class="brand">Resume Analyzer</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="#" onclick="clearSession(); window.location.href='index.html';">Log out</a>
    </nav>
  </div>

  <h2>Upload your resume</h2>
  <p class="muted">PDF or DOCX. Add a job description if you want a match score against a specific posting.</p>

  <div class="card">
    <label>Resume file</label>
    <input type="file" id="file-input" accept=".pdf,.docx">

    <label>Job description (optional)</label>
    <textarea id="job-description" placeholder="Paste the job posting here to get a match score and keyword gap analysis."></textarea>

    <button id="analyze-btn" onclick="handleAnalyze()">Analyze resume</button>
    <div class="error" id="analyze-error"></div>
    <p class="muted" id="status" style="margin-top:12px;"></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();

  async function handleAnalyze() {
    const fileInput = document.getElementById("file-input");
    const jobDescription = document.getElementById("job-description").value.trim();
    const errorEl = document.getElementById("analyze-error");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("analyze-btn");

    errorEl.textContent = "";
    if (!fileInput.files.length) {
      errorEl.textContent = "Choose a resume file first.";
      return;
    }

    btn.disabled = true;
    statusEl.textContent = "Reading your resume and running the analysis — this can take up to 30 seconds…";

    try {
      const result = await analyzeResume(fileInput.files[0], jobDescription);
      sessionStorage.setItem("latestAnalysis", JSON.stringify(result));
      window.location.href = "dashboard.html";
    } catch (e) {
      errorEl.textContent = e.message;
      statusEl.textContent = "";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
