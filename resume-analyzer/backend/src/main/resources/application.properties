# ==============================
# Server
# ==============================
server.port=8080


# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/resume_analyzer?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=resume_app
spring.datasource.password=ResumeApp@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Force Connector/J properties through Hikari
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.sslMode=DISABLED


# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ==============================
# File Upload
# ==============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ==============================
# JWT
# ==============================
jwt.secret=change-this-to-a-long-random-secret-string-in-production-please
jwt.expiration-ms=86400000
# ==============================
# Anthropic AI
# ==============================
anthropic.api.key=
anthropic.api.model=claude-sonnet-4-6
anthropic.api.url=https://api.anthropic.com/v1/messages